<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/style.css">
    <title>Qraphql</title>
</head>

<body>
    <div>
        <div id="message-box" class="message-box"></div>
        <div id="logged-in-section">
            <nav class="navbar">
                <h2 id="welcome-message"></h2>
                <button type="button" id="logout">Logout</button>
            </nav>

            <div class="flex-container">
                <div class="user-info-section">
                    <h1>User Information</h1>
                    <div id="user-info-content"></div>
                </div>
                <div class="xp-pie">
                    <h1>XP by Project</h1>
                    <svg id="xpPieChart" width="500" height="500" viewBox="-150 -150 300 300"></svg>
                </div>
                <div class="xp-progression">
                    <h1>XP Progression</h1>
                    <div class="tooltip" id="tooltip"></div>
                    <svg id="xpGraph" width="800" height="400"></svg>
                </div>
            </div>
            
        </div>

        <div id="guest-section">
            <h2>Please log in</h2>
            <input type="email" placeholder="Enter your email" id="email">
            <input type="password" placeholder="Enter your password" id="password">
            <button type="button" id="login-btn">Login</button>
        </div>
    </div>

    <script type="module" src="/static/main.js"></script>
</body>

</html>
