<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/style.css">
    <title>Qraphql</title>
</head>

<body>
    <div>
        <div id="logged-in-section">
            <h2 id="welcome-message"></h2>
            <p>You are logged in.</p>
            <button type="button" onclick="logout()" id="logout">Logout</button>
            <div id="user-info"></div>

            <div>
                <h1>XP Progression</h1>
                <div class="tooltip" id="tooltip"></div>
                <svg id="xpGraph" width="800" height="400"></svg>
            </div>

            <div>
                <svg id="xpPieChart" width="300" height="300" viewBox="-150 -150 300 300"></svg>
            </div>
        </div>

        <div id="guest-section">
            <h2>Please log in</h2>
            <input type="email" placeholder="Enter your email" id="email">
            <input type="password" placeholder="Enter your password" id="password">
            <button type="button" id="login-btn">Login</button>
        </div>
    </div>

    <script type="module" src="/static/main.js"></script>
</body>

</html>
