<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Qraphql Dashboard</title>
</head>

<body>
    <div id="message-box" class="message-box"></div>
    
    <div class="container">
        <div id="logged-in-section">
            <nav class="navbar">
                <h2 id="welcome-message"></h2>
                <button type="button" id="logout">
                    Logout
                </button>
            </nav>

            <div class="flex-container">
                <div class="user-info-section card">
                    <h1>User Information</h1>
                    <div id="user-info-content"></div>
                </div>
                <div class="xp-pie card">
                    <h1>XP by Project</h1>
                    <svg id="xpPieChart" width="300" height="300" viewBox="-150 -150 300 300"></svg>
                </div>
                <div class="xp-progression card">
                    <h1>XP Progression</h1>
                    <div class="tooltip" id="tooltip"></div>
                    <svg id="xpGraph" width="100%" height="400"></svg>
                </div>
            </div>
        </div>

        <div id="guest-section" class="fadeIn">
            <h2>Login to Your Dashboard</h2>
            <div class="form-group">
                <input type="email" placeholder="Email address" id="email">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" id="password">
            </div>
            <button type="button" id="login-btn">
                Login
            </button>
        </div>
    </div>

    <script type="module" src="/static/main.js"></script>
</body>

</html>
