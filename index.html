<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/public/favicon.png">
    <title>Qraphql Dashboard</title>
</head>

<body>
    <div id="message-box" class="message-box"></div>

    <div class="container">
        <div id="logged-in-section">
            <nav class="navbar">
                <h2 id="welcome-message">
                    <div id="graphql-logo-container">
                        <img id="graph-logo" src="https://graphql.org/img/logo.svg" alt="GraphQL Logo" />
                        <span id="graph-logo-span">GraphQL</span>
                    </div>
                </h2>
                <div id="btn-container">
                    <button type="button" id="theme-toggle" title="Toggle Theme">
                        🌙
                    </button>
                    <button type="button" id="logout">
                        Logout
                    </button>
                </div>
            </nav>
            <div class="flex-container">
                <div id="personal-info-div"></div>
                <div id="account-info-div"></div>
                <div class="remove card" id="stats-info-div"></div>
                <div class="remove card" id="xp-pie-div"></div>
                <div class="remove card" id="xp-progression-div"></div>
                <div class="tooltip" id="tooltip"></div>
            </div>
        </div>

        <div id="guest-section" class="fadeIn">
            <h2>Login to Your Dashboard</h2>
            <div class="form-group">
                <input type="email" placeholder="Email address" id="email">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" id="password">
            </div>
            <button type="button" id="login-btn">
                Login
            </button>
        </div>
    </div>

    <script type="module" src="/static/main.js"></script>
</body>

</html>
